# One-command self-hosted CardMirror relay:
#   RELAY_TOKEN=$(openssl rand -hex 24) docker compose up -d
# The relay listens on 127.0.0.1:8410 only (see `ports` below). Front it
# with an HTTPS reverse proxy, then set Settings → Collaboration → Custom
# relay URL to https://<your-domain>/relay and Custom relay token to the
# same token.
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    volumes:
      - relay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 3s
      retries: 10

  relay:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://relay:relay@postgres:5432/relay
      RELAY_TOKEN: ${RELAY_TOKEN:?set RELAY_TOKEN}
      # Which GitHub repos your users' plugin installers accept
      # (comma-separated owner/repo). Plugins are full-trust code —
      # curate deliberately. Defaults to the app's baked list.
      RELAY_PLUGIN_ALLOWLIST: ${RELAY_PLUGIN_ALLOWLIST:-shreerammodi/ebb,shreerammodi/cardmirror-ebb-plugin}
    # Loopback only: Docker's published ports bypass ufw, so a bare
    # "8410:8000" would serve plain HTTP to the internet. Put an HTTPS
    # reverse proxy (Caddy, nginx) on this host in front of it. To reach
    # it from other machines on a trusted LAN instead, drop "127.0.0.1:".
    ports:
      - "127.0.0.1:8410:8000"

volumes:
  relay_pgdata:
